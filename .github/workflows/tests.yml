name: Tests / 测试

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q -W error::ResourceWarning
      - run: python -m serial_gateway --language en selftest
      - run: python tools/check_public_tree.py

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.1.18
      - run: python -m platformio run --project-dir firmware -e esp32s3
        env:
          PLATFORMIO_CORE_DIR: ${{ github.workspace }}/firmware/.pio-core
          GIT_CEILING_DIRECTORIES: ${{ github.workspace }}/firmware

  arduino:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.1.18
      - run: python -m platformio run --project-dir arduino/ci
        env:
          # Outside the repository: the library is linked with symlink://.. and must not see the core.
          PLATFORMIO_CORE_DIR: ${{ runner.temp }}/pio-core
