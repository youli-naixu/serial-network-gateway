; Compile-only CI for the SerialNetworkGateway Arduino library.
; Run from this directory:
;   PLATFORMIO_CORE_DIR=<offline core with espressif32@6.10.0> pio run
; select_example.py points each env at ../examples/<custom_example>.
[platformio]
build_dir = .pio/build
libdeps_dir = .pio/libdeps
default_envs = StandaloneGateway, EmbeddedMaintenance

[env]
; espressif32@6.10.0 ships Arduino-ESP32 2.0.17 (IDF 4.4.7), the same core as
; the reference host project (espressif32 7.0.1 is pinned to the same framework).
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
lib_ldf_mode = deep+
lib_deps = symlink://../
build_flags = -Wall -Wextra -Wno-unused-parameter
extra_scripts = pre:select_example.py

[env:StandaloneGateway]
custom_example = StandaloneGateway

[env:EmbeddedMaintenance]
custom_example = EmbeddedMaintenance
