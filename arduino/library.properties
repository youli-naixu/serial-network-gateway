name=SerialNetworkGateway
version=0.3.0
author=Serial Network Gateway contributors
maintainer=Serial Network Gateway contributors
sentence=Experimental RFC2217 (Telnet COM port) UART-over-WiFi gateway for ESP32 with an on-demand maintenance mode.
paragraph=Single client, bounded queues that fault instead of dropping data, quiet mode for virtual-COM clients that do not tolerate unsolicited Telnet negotiation, optional source IP allow-list and explicit target reset/boot control.
category=Communication
architectures=esp32
