[platformio]
core_dir = .pio-core
src_dir = main
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv

; Compile-only fixture. GW_COMPILE_CHECK_ONLY prevents networking/UART setup.
[env:esp32s3_compilecheck]
extends = env:esp32s3
board_build.esp-idf.sdkconfig_path = sdkconfig.compilecheck
